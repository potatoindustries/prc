<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PRC • Profil Kierowcy</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flag-icons@7.2.3/css/flag-icons.min.css" />
    <link rel="stylesheet" href="css/archiwum.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="icon" href="https://i.imgur.com/CqBPD1t.png" />

    <style>
      /* ===== HELPERS ===== */
      .no-transition * { transition: none !important; }
      .icon-moon { display: none; }
      body.dark .icon-sun  { display: none; }
      body.dark .icon-moon { display: block; }

      /* ===== HERO BG ===== */
      .hero__bg {
        position: absolute; inset: 0;
        background-image: url("https://wrcwings.files.wordpress.com/2017/04/delecour_monte_1993.jpg");
        background-size: cover;
        background-position: center 30%;
        background-repeat: no-repeat;
      }

      /* ===== DRIVER NAME BLOCK ===== */
      .driver-hero-bottom {
        position: absolute;
        bottom: 0; left: 0; right: 0;
        padding: 0 44px 36px;
        display: flex;
        align-items: center;
        gap: 24px;
        max-width: 1200px;
        margin: 0 auto;
      }

      /* ===== SOCIAL ICONS ===== */
      .driver-hero-bottom__socials {
        display: flex;
        gap: 10px;
        margin-left: auto;
        flex-shrink: 0;
        align-self: flex-end;
        margin-right: 40px;
        padding-bottom: 4px;
      }
      .driver-social-icon {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: rgba(15, 20, 30, 0.55);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border: 1px solid rgba(255,255,255,0.15);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #e8eaf0;
        text-decoration: none;
        transition: background .22s, transform .18s, border-color .22s;
      }
      .driver-social-icon:hover {
        background: rgba(255, 255, 255, 0.18);
      }
      .driver-social-icon svg {
        width: 18px;
        height: 18px;
        fill: currentColor;
        flex-shrink: 0;
      }
      .driver-hero-bottom__avatar {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        object-fit: cover;
        border: 3px solid rgba(255,255,255,.45);
        flex-shrink: 0;
        display: block;
      }
      .driver-hero-bottom__text {
        flex: 1;
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 24px;
        row-gap: 12px;
      }
      .driver-hero-bottom__name {
        font-family: "WRCCleanBold", Arial, sans-serif;
        font-size: 48px;
        line-height: 1.05;
        color: #fff;
        text-shadow: 0 2px 14px rgba(0,0,0,.5);
        margin: 0;
        display: flex;
        flex-direction: column;
      }

      /* ===== NAVBAR STYLE - ZGODNY Z INDEX.HTML ===== */
      .topbar__link {
        font-family: "SebinoMedium", "SebinoSoft", Arial, sans-serif !important;
        font-weight: 550 !important;
      }
      
      .rallytv-btn {
        font-family: "SebinoMedium", "SebinoSoft", Arial, sans-serif !important;
        font-weight: 500 !important;
        display: inline-flex !important;
        align-items: center;
        gap: 6px;
        padding: 0 14px 0 10px !important;
        transition: background 0.35s, color 0.35s;
      }
      
      .rallytv-btn::before {
        content: '';
        display: block;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: rgba(255,255,255,0.4);
        flex-shrink: 0;
        transition: background 0.35s, box-shadow 0.35s;
      }
      
      .rallytv-btn[data-status="online"] {
        background: #166534 !important;
        color: #bbf7d0 !important;
      }
      .rallytv-btn[data-status="online"]::before {
        background: #4ade80;
        box-shadow: 0 0 0 2px rgba(74,222,128,.35);
        animation: rtv-pulse 2.4s ease-in-out infinite;
      }
      .rallytv-btn[data-status="offline"] {
        background: #7f1d1d !important;
        color: #fecaca !important;
      }
      .rallytv-btn[data-status="offline"]::before {
        background: #f87171;
        box-shadow: 0 0 0 2px rgba(248,113,113,.3);
      }
      .rallytv-btn[data-status="loading"] {
        background: #374151 !important;
        color: #d1d5db !important;
      }
      .rallytv-btn[data-status="loading"]::before {
        background: #9ca3af;
        animation: rtv-pulse 1s ease-in-out infinite;
      }
      
      .rallytv-status-label {
        font-size: 12px;
        font-weight: 500;
        letter-spacing: .02em;
        line-height: 1;
      }
      
      @keyframes rtv-pulse {
        0%,100% { box-shadow: 0 0 0 2px rgba(74,222,128,.35); }
        50%      { box-shadow: 0 0 0 5px rgba(74,222,128,.08); }
      }

      /* ===== MAIN BACKGROUND ===== */
      .driver-main {
        background: var(--section-bg);
        transition: background-color .38s ease;
      }
      body.dark .driver-main { background: #1a1a1a; }

      .driver-content {
        max-width: 1100px;
        margin: 0 auto;
        padding: 1px 44px 80px;
      }

      /* ===== SECTION TITLE ===== */
      .driver-section-title {
        font-family: "WRCCleanBold", Arial, sans-serif;
        font-size: 25px;
        margin: 44px 0 18px;
        color: #26384b;
        border-left: 4px solid var(--orange);
        padding-left: 15px;
        transition: color .28s;
      }
      body.dark .driver-section-title { color: #f3f3f3; }

      /* ===== FIX DLA TABEL (Identyczne linie) ===== */
      
      /* Card Common */
      .facts-card, .stats-card {
        background: #fff;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 2px 10px rgba(0,0,0,.06);
        margin-bottom: 32px;
        transition: background .38s, box-shadow .32s;
        box-sizing: border-box;
      }
      body.dark .facts-card, body.dark .stats-card {
        background: #1e1e1e;
        box-shadow: 0 7px 18px rgba(0,0,0,.28);
      }

      .facts-card__head, .stats-card__head {
        background: #f2f3f3;
        color: #67727f;
        font-family: "SebinoSoft", Arial, sans-serif;
        font-size: 11px;
        letter-spacing: .03em;
        text-transform: uppercase;
        font-weight: 500;
        padding: 0 18px;
        min-height: 44px;
        display: flex;
        align-items: center;
        transition: background .38s, color .28s;
      }
      body.dark .facts-card__head, body.dark .stats-card__head {
        background: #2e2e2e;
        color: #9a9088;
      }

      /* Wiersze w Facts Card */
      .facts-card__row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 18px;
        min-height: 48px;
        background: #fff;
        font-family: "SebinoSoft", Arial, sans-serif;
        font-size: 13px;
        color: #26384b;
        border-bottom: 1px solid rgba(225, 231, 238, 0.8);
        transition: background .28s, color .28s, border-bottom-color .28s;
        box-sizing: border-box;
      }
      
      /* Wiersze w Stats Card */
      .stats-card__row {
        display: grid;
        grid-template-columns: 1fr 200px;
        align-items: center;
        padding: 0 18px;
        min-height: 48px;
        background: #fff;
        font-family: "SebinoSoft", Arial, sans-serif;
        font-size: 13px;
        color: #26384b;
        border-bottom: 1px solid rgba(225, 231, 238, 0.8);
        transition: background .28s, color .28s, border-bottom-color .28s;
        box-sizing: border-box;
      }

      body.dark .facts-card__row, body.dark .stats-card__row {
        background: #1e1e1e;
        color: #c0c0c0;
        border-bottom-color: rgba(60, 72, 88, 0.4);
      }

      /* Usunięcie ostatniej linii w każdej tabeli */
      .facts-card__row:last-child, .stats-card__row:last-child {
        border-bottom: none;
      }

      .facts-card__row:hover, .stats-card__row:hover { background: #fcfdff; }
      body.dark .facts-card__row:hover, body.dark .stats-card__row:hover { background: #252525; }

      .stats-card__row > div:last-child {
        text-align: right;
        color: #1a5da6;
        font-weight: 500;
      }
      body.dark .stats-card__row > div:last-child { color: #5b9de0; }

      /* Ustawienie nagłówka statystyk (grid) */
      .stats-card__head {
        display: grid;
        grid-template-columns: 1fr 200px;
      }
      .stats-card__head > div:last-child { text-align: right; }

      /* ===== BIO & IMAGES ===== */
      .driver-bio p {
        font-family: "SebinoMedium", Arial, sans-serif !important;
        font-size: 14px;
        line-height: 1.75;
        color: #26384b;
        margin-bottom: 16px;
      }
      body.dark .driver-bio p { color: #c0c0c0; }

      .driver-img-wrap { margin: 28px 0 32px; }
      .driver-img-wrap img { width: 100%; border-radius: 10px; display: block; max-height: 460px; object-fit: cover; }
      .driver-img-caption { font-family: "SebinoSoft", Arial, sans-serif; font-size: 12px; color: #67727f; margin-top: 8px; margin-left: 5px;}
      .driver-img-copyright { display: block; font-size: 10px; color: #aaa; margin-top: 2px; }

      .driver-footer-img { width: 100%; border-radius: 10px; display: block; object-fit: cover; max-height: 360px; margin-top: 52px; }

      /* ANIMATE */
      .animate-on-scroll { opacity: 0; transform: translateY(18px); transition: opacity .5s ease, transform .5s ease; }
      .animate-on-scroll.visible { opacity: 1; transform: none; }
      
      @media (max-width: 860px) {
        .driver-hero-bottom__name { font-size: 40px; }
        .stats-card__row, .stats-card__head { grid-template-columns: 1fr 100px; }
      }

            .achievement-place {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 8px;
        flex-wrap: wrap;
      }

      .laurel-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        transition: transform 0.15s ease;
        cursor: default;
        position: relative;
      }

      .laurel-icon:hover {
        transform: scale(1.15);
      }

      .laurel-img {
        width: 18px;
        height: 18px;
        display: block;
        object-fit: contain;
        filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.1));
      }

      /* ZŁOTY */
      .laurel-icon--gold .laurel-img {
        filter: brightness(0) saturate(100%) invert(67%) sepia(76%) saturate(1894%) hue-rotate(358deg) brightness(102%) contrast(89%) drop-shadow(0 1px 1px rgba(255, 215, 0, 0.25));
      }

      /* SREBRNY */
      .laurel-icon--silver .laurel-img {
        filter: brightness(0) saturate(100%) invert(84%) sepia(13%) saturate(247%) hue-rotate(347deg) brightness(88%) contrast(87%) drop-shadow(0 1px 1px rgba(192, 192, 192, 0.3));
      }

      /* BRĄZOWY */
      .laurel-icon--bronze .laurel-img {
        filter: brightness(0) saturate(100%) invert(35%) sepia(74%) saturate(1024%) hue-rotate(348deg) brightness(84%) contrast(82%) drop-shadow(0 1px 1px rgba(139, 69, 19, 0.3));
      }

      /* Połysk */
      .laurel-icon::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0) 60%, rgba(0,0,0,0.02) 100%);
        border-radius: 50%;
        pointer-events: none;
        opacity: 0.4;
      }

      /* Dark mode */
      body.dark .laurel-icon--gold .laurel-img {
        filter: brightness(0) saturate(100%) invert(77%) sepia(93%) saturate(1452%) hue-rotate(356deg) brightness(98%) contrast(92%) drop-shadow(0 1px 2px rgba(255, 215, 0, 0.35));
      }

      body.dark .laurel-icon--silver .laurel-img {
        filter: brightness(0) saturate(100%) invert(91%) sepia(12%) saturate(412%) hue-rotate(346deg) brightness(92%) contrast(89%) drop-shadow(0 1px 2px rgba(192, 192, 192, 0.4));
      }

      body.dark .laurel-icon--bronze .laurel-img {
        filter: brightness(0) saturate(100%) invert(40%) sepia(68%) saturate(892%) hue-rotate(346deg) brightness(86%) contrast(84%) drop-shadow(0 1px 2px rgba(139, 69, 19, 0.4));
      }

      body.dark .laurel-icon::after {
        background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0) 60%, rgba(0,0,0,0.05) 100%);
        opacity: 0.3;
      }

      @media (max-width: 560px) {
        .laurel-img { width: 16px; height: 16px; }
        .achievement-place { gap: 5px; }
      }
    </style>

    <script>
      if (localStorage.getItem("wrc-theme") === "dark")
        document.documentElement.classList.add("wrc-dark");
    </script>
  </head>

              <div class="driver-hero-bottom__name">

            </div>

            <div class="driver-hero-bottom__socials">
              <!-- Steam -->
              <a href="https://steamcommunity.com/profiles/" target="_blank" class="driver-social-icon" aria-label="Steam" title="Steam">

      <main class="driver-main">
        <div class="driver-content">
          
          <img src="https://wrcwings.files.wordpress.com/2017/04/delecour_monte_1993.jpg" alt="Rally action" class="driver-footer-img animate-on-scroll" style="object-position: center 70%;"/>

    <footer class="site-footer">
      <div class="site-footer__sponsors">
        <div class="footer-photo"><img src="https://i.imgur.com/JSWXXPK.png" alt="" /></div>
        <div class="footer-photo"><img src="https://i.imgur.com/3e0jqkQ.png" alt="" /></div>
        <div class="footer-photo"><img src="https://i.imgur.com/BQ7N4GM.png" alt="" /></div>
      </div>

    </footer>

    <script>
      // Floating logo logic
      const logo = document.querySelector(".floating-logo");
      const hero = document.querySelector(".hero");
      window.addEventListener("scroll", () => {
        if (hero.getBoundingClientRect().bottom <= 0) logo.classList.add("logo--dark");
        else logo.classList.remove("logo--dark");
      }, { passive: true });

      // Intersection Observer for animations
      const observer = new IntersectionObserver((entries) => {
        entries.forEach((e) => { if (e.isIntersecting) { e.target.classList.add("visible"); observer.unobserve(e.target); } });
      }, { threshold: 0.1 });
      document.querySelectorAll(".animate-on-scroll").forEach((el) => observer.observe(el));

      // Theme toggle
      (function () {
        if (localStorage.getItem("wrc-theme") === "dark") document.body.classList.add("dark");
        var btn = document.getElementById("themeToggle");
        if (btn) {
          btn.addEventListener("click", function () {
            var isDark = document.body.classList.toggle("dark");
            localStorage.setItem("wrc-theme", isDark ? "dark" : "light");
          });
        }
      })();
      
      // Status dla przycisku Rally.TV/PRC
      (function() {
        const btn = document.querySelector('.rallytv-btn');
        if (btn) {
          btn.setAttribute('data-status', 'online');
        }
      })();
    </script>
  </body>
