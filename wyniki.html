    // Funkcja tworząca link do strony kierowcy w folderze drivers/
function getDriverLink(driverName, driverId) {
  let slug = driverName.toLowerCase()
    .replace(/ł/g, 'l')
    .replace(/ą/g, 'a')
    .replace(/ć/g, 'c')
    .replace(/ę/g, 'e')
    .replace(/ń/g, 'n')
    .replace(/ó/g, 'o')
    .replace(/ś/g, 's')
    .replace(/ź/g, 'z')
    .replace(/ż/g, 'z')
    .replace(/\s+/g, '_')
    .replace(/[^a-z0-9_]/g, '');
  
  if (driverId) slug = driverId;
  
  return `<a href="${slug}.html" class="driver-link">${driverName}</a>`;
}

  <script>
    function getFlagEmoji(countryCode) {
      if (!countryCode) return '🏁';
      const specialFlags = {
        'wls': '🏴󠁧󠁢󠁷󠁬󠁳󠁿', 'sct': '🏴󠁧󠁢󠁳󠁣󠁴󠁿', 'eng': '🏴󠁧󠁢󠁥󠁮󠁧󠁿', 'gb': '🇬🇧',
        'gb-eng': '🏴󠁧󠁢󠁥󠁮󠁧󠁿', 'gb-sct': '🏴󠁧󠁢󠁳󠁣󠁴󠁿', 'gb-wls': '🏴󠁧󠁢󠁷󠁬󠁳󠁿'
      };
      const code = countryCode.toLowerCase();
      if (specialFlags[code]) return specialFlags[code];
      if (code.length === 2) {
        try {
          const codePoints = code.toUpperCase().split('').map(char => 127397 + char.charCodeAt());
          return String.fromCodePoint(...codePoints);
        } catch(e) { return '🏁'; }
      }
      return '🏁';
    }

    const logo = document.querySelector(".floating-logo");

    let currentRallyId = null;
    let rallyData      = null;

    function getRallyIdFromUrl() {
      return new URLSearchParams(window.location.search).get('rally');
    }

    function timeToSeconds(timeStr) {
      if (!timeStr || timeStr === '—' || timeStr === 'DNF' || timeStr === 'DNS' || timeStr === 'DSQ' || timeStr === 'RET') return Infinity;
      const match = timeStr.match(/^(\d+):(\d+)\.(\d+)$/);
      if (match) return parseInt(match[1]) * 60 + parseInt(match[2]) + parseInt(match[3]) / 1000;
      return Infinity;
    }

    function secondsToTime(totalSeconds) {
      if (totalSeconds === Infinity || totalSeconds === null || isNaN(totalSeconds)) return '—';
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = (totalSeconds % 60).toFixed(3);
      return `${minutes}:${seconds.padStart(6, '0')}`;
    }

    function shortTime(timeStr) {
      if (!timeStr) return timeStr;
      const m = timeStr.match(/^(\d+:\d{2})\.(\d{3})$/);
      if (!m) return timeStr;
      const rounded = Math.round(parseInt(m[2]) / 100);
      if (rounded >= 10) {
        const secs = timeToSeconds(timeStr);
        if (secs === Infinity) return timeStr;
        const carry = Math.floor(secs) + 1;
        const mm = Math.floor(carry / 60);
        const ss = carry % 60;
        return `${mm}:${String(ss).padStart(2,'0')}.0`;
      }
      return `${m[1]}.${rounded}`;
    }

    function formatDiff(diffSeconds) {
      if (diffSeconds === Infinity || diffSeconds === null || isNaN(diffSeconds)) return '—';
      if (diffSeconds === 0) return '—';
      const absDiff = Math.abs(diffSeconds);
      const minutes = Math.floor(absDiff / 60);
      const seconds = (absDiff % 60).toFixed(3);
      const sign = diffSeconds > 0 ? '+' : '';
      if (minutes > 0) {
        return `${sign}${minutes}:${seconds.padStart(6, '0')}`;
      }
      return `${sign}${seconds}s`;
    }

    function getSortPriority(status) {
      if (status === 'OK') return 0;
      if (status === 'DNF') return 1;
      if (status === 'RET') return 2;
      if (status === 'DNS') return 3;
      if (status === 'DSQ') return 4;
      return 0;
    }

    function sortResultsWithPriority(results) {
      return [...results].sort((a, b) => {
        const priorityA = getSortPriority(a.status);
        const priorityB = getSortPriority(b.status);
        if (priorityA !== priorityB) return priorityA - priorityB;
        const timeA = a.totalTimeSeconds !== undefined && a.totalTimeSeconds !== Infinity ? a.totalTimeSeconds : Infinity;
        const timeB = b.totalTimeSeconds !== undefined && b.totalTimeSeconds !== Infinity ? b.totalTimeSeconds : Infinity;
        return timeA - timeB;
      });
    }

    function getCumulativePenalty(penalties, stagesToSum, driverId) {
      let total = 0;
      for (const stageName of stagesToSum) {
        const stagePenalties = penalties?.[stageName] || {};
        total += stagePenalties[driverId] || 0;
      }
      return total;
    }

    function computePositionsAfterStages(results, regularStages, upToIndex, allDriverIds) {
      const cumMap = {};
      for (const driverId of allDriverIds) {
        let total = 0, valid = true;
        for (let si = 0; si <= upToIndex; si++) {
          const sName  = regularStages[si];
          const sData  = results.stages?.[sName] || [];
          const dEntry = sData.find(e => e.driverId === driverId);
          if (!dEntry || dEntry.status !== 'OK') { valid = false; break; }
          const t = timeToSeconds(dEntry.time);
          if (t === Infinity) { valid = false; break; }
          total += t;
        }
        cumMap[driverId] = valid ? total : Infinity;
      }

      const sorted = allDriverIds
        .filter(id => cumMap[id] !== Infinity)
        .sort((a, b) => cumMap[a] - cumMap[b]);

      const posMap = {};
      let pos = 1;
      for (let i = 0; i < sorted.length; i++) {
        if (i > 0 && Math.abs(cumMap[sorted[i]] - cumMap[sorted[i-1]]) < 0.001) {
          posMap[sorted[i]] = posMap[sorted[i-1]];
        } else {
          posMap[sorted[i]] = pos;
        }
        pos++;
      }
      for (const id of allDriverIds) {
        if (!(id in posMap)) posMap[id] = null;
      }
      return posMap;
    }

    /**
     * Buduje HTML komórki pozycji.
     * Wynik: [cyfra pozycji]  [pill: ▲/▼  cyfra zmiany]
     */
    function buildPosCellHtml(currentPos, prevPos) {
      const posText = currentPos !== null ? currentPos : '—';

      if (currentPos === null || prevPos === null) {
        return `<span class="pos-number">${posText}</span>`;
      }

      const diff    = prevPos - currentPos; // >0 awans, <0 spadek
      const absDiff = Math.abs(diff);

      if (diff === 0) {
        return `<span class="pos-number">${posText}</span>`;
      }

      const cls = diff > 0 ? 'up' : 'down';

      const arrowUp   = `<svg viewBox="0 0 8 6" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 0L8 6H0z" fill="currentColor"/></svg>`;
      const arrowDown = `<svg viewBox="0 0 8 6" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 6L0 0H8z" fill="currentColor"/></svg>`;
      const arrow     = diff > 0 ? arrowUp : arrowDown;

      return `<span class="col-pos-wrap">` +
                `<span class="pos-number">${posText}</span>` +
                `<span class="pos-change pos-change--${cls}">` +
                  `<span class="pos-change__arrow">${arrow}</span>` +
                  `<span class="pos-change__num">${absDiff}</span>` +
                `</span>` +
             `</span>`;
    }

    function initOverallSorting() {
      const table = document.getElementById('overallTable');
      if (!table) return;
      const head = table.querySelector('.standings-table__head');
      const body = table.querySelector('.standings-table__body');
      if (!head || !body) return;
      const sortableColumns = Array.from(head.querySelectorAll('[data-sort]'));
      let currentSort = { column: 'total', direction: 'asc', stageIndex: null, stageName: null };
      const totalTimeColumn = head.querySelector('[data-sort="total"]');
      if (totalTimeColumn) totalTimeColumn.classList.add('sort-asc');
      function getSortValue(row, columnKey, stageIndex = null) {
        const status = row.dataset.status, priority = getSortPriority(status);
        if (columnKey === 'pos')    return parseFloat(row.dataset.pos) || 999;
        if (columnKey === 'total')  return priority * 1e9 + (parseFloat(row.dataset.totalSeconds) || Infinity);
        if (columnKey === 'points') return parseFloat(row.dataset.totalPoints) || 0;
        if (columnKey === 'ps')     { const c = row.querySelector('[data-ps-time]'); return priority * 1e9 + (c ? parseFloat(c.getAttribute('data-ps-time')) || Infinity : Infinity); }
        if (columnKey.startsWith('os_')) { const c = row.querySelector(`[data-stage-index="${stageIndex}"]`); return priority * 1e9 + (c ? parseFloat(c.getAttribute('data-os-time')) || Infinity : Infinity); }
        return 0;
      }
      function sortTable(columnKey, sortType, direction, stageIndex = null, stageName = null) {
        const rows = Array.from(body.querySelectorAll('.standings-row'));
        rows.sort((a, b) => {
          if (columnKey === 'driver') return direction === 'asc' ? (a.dataset.driverName || '').localeCompare(b.dataset.driverName || '', 'pl') : (b.dataset.driverName || '').localeCompare(a.dataset.driverName || '', 'pl');
          return direction === 'asc' ? getSortValue(a, columnKey, stageIndex) - getSortValue(b, columnKey, stageIndex) : getSortValue(b, columnKey, stageIndex) - getSortValue(a, columnKey, stageIndex);
        });
        rows.forEach(row => body.appendChild(row));
        const updatedRows = Array.from(body.querySelectorAll('.standings-row'));
        let curPos = 1, prevT = null, leaderT = null;
        updatedRows.forEach((row, i) => {
          const status = row.dataset.status, priority = getSortPriority(status);
          let timeValue;
          if (columnKey === 'total' || columnKey === 'pos') timeValue = parseFloat(row.dataset.totalSeconds) || Infinity;
          else if (columnKey === 'ps') { const c = row.querySelector('[data-ps-time]'); timeValue = c ? parseFloat(c.getAttribute('data-ps-time')) || Infinity : Infinity; }
          else if (columnKey.startsWith('os_')) { const c = row.querySelector(`[data-stage-index="${stageIndex}"]`); timeValue = c ? parseFloat(c.getAttribute('data-os-time')) || Infinity : Infinity; }
          else timeValue = parseFloat(row.dataset.totalSeconds) || Infinity;
          const posCell = row.querySelector('.col-pos'), diffCell = row.querySelector('.col-diff');
          if (priority === 0 && timeValue !== Infinity) {
            if (i === 0) leaderT = timeValue;
            if (i > 0 && Math.abs(timeValue - prevT) < 0.001) { posCell.textContent = curPos; row.dataset.pos = curPos; }
            else { curPos = i + 1; posCell.textContent = curPos; row.dataset.pos = curPos; }
            if (diffCell && (columnKey === 'total' || columnKey === 'pos' || columnKey === 'ps' || columnKey === ('os_' + stageIndex))) { const diff = timeValue - leaderT; diffCell.textContent = diff === 0 ? '—' : formatDiff(diff); row.dataset.diff = diff; }
          } else if (priority === 1 && timeValue !== Infinity && leaderT !== null) {
            posCell.textContent = '—'; row.dataset.pos = 999;
            if (diffCell) diffCell.textContent = formatDiff(timeValue - leaderT);
          } else { posCell.textContent = '—'; row.dataset.pos = 999; if (diffCell) diffCell.textContent = '—'; }
          prevT = timeValue;
        });
      }
      sortableColumns.forEach(col => {
        col.addEventListener('click', (e) => {
          e.stopPropagation();
          const columnKey = col.dataset.sort, sortType = col.dataset.type;
          const stageIndex = col.dataset.stageIndex ? parseInt(col.dataset.stageIndex) : null;
          const stageName  = col.dataset.stageName || null;
          sortableColumns.forEach(c => c.classList.remove('sort-asc', 'sort-desc'));
          const direction = (currentSort.column === columnKey && currentSort.stageIndex === stageIndex && currentSort.stageName === stageName) ? (currentSort.direction === 'asc' ? 'desc' : 'asc') : 'asc';
          currentSort = { column: columnKey, direction, stageIndex, stageName };
          col.classList.add(direction === 'asc' ? 'sort-asc' : 'sort-desc');
          sortTable(columnKey, sortType, direction, stageIndex, stageName);
        });
      });
      sortTable('total', 'time', 'asc', null, null);
    }
    
    function generateStageTabs() {
      const tabsContainer = document.getElementById('stageTabs');
      const stages = rallyData.stages, powerStage = rallyData.powerStage;
      if (!stages || stages.length === 0) return;
      const regularStages = stages.filter(s => s !== powerStage);
      const hasPowerStage = powerStage && stages.includes(powerStage);
      let html = '<button class="tab active" type="button" data-tab="lacznie">Łącznie</button>';
      if (hasPowerStage) html += `<button class="tab" type="button" data-tab="powerstage" data-is-ps="true">Power Stage</button>`;

        const originalIndex = stages.findIndex(s => s === stage);
        html += `<button class="tab" type="button" data-tab="stage_${originalIndex}" data-is-ps="false">OS${index + 1}</button>`;

      document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', async () => {
          const target = tab.dataset.tab, isPS = tab.dataset.isPs === 'true';

          document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));

            document.querySelector(`.tab-panel[data-panel="stage_${powerStageIndex}"]`)?.classList.add('active');
          } else {
            const stageIndex = parseInt(target.split('_')[1]);

    async function showStageResults(stageIndex, isPowerStage = false) {
      const stageName = rallyData.stages[stageIndex];
      const [results, drivers, teams] = await Promise.all([
        api.getRallyResults(currentRallyId),
        api.getDrivers(),
        api.getTeams()
      ]);
      if (!results?.stages?.[stageName] || results.stages[stageName].length === 0) {
        let stagePanel = document.querySelector(`.tab-panel[data-panel="stage_${stageIndex}"]`);
        if (!stagePanel) { stagePanel = document.createElement('div'); stagePanel.className = 'tab-panel'; stagePanel.setAttribute('data-panel', `stage_${stageIndex}`); document.querySelector('.table-section').appendChild(stagePanel); }
        stagePanel.innerHTML = '<div class="results-card"><div class="placeholder-panel">- ⌛︎ -</div></div>';
        return;
      }
      const stageResults  = results.stages[stageName];
      const allPenalties  = results.penalties || {};
      const powerStage    = rallyData.powerStage;
      const regularStages = rallyData.stages.filter(s => s !== powerStage);
      const regularStageIndex    = isPowerStage ? -1 : regularStages.indexOf(stageName);
      const stagesToSumPenalties = isPowerStage ? [stageName] : regularStages.slice(0, regularStageIndex + 1);
      const allDriverIds = stageResults.map(r => r.driverId);

      // Pozycje po poprzednim OS
      let prevPosMap = {};
      if (!isPowerStage) {
        if (regularStageIndex <= 0) { for (const id of allDriverIds) prevPosMap[id] = null; }
        else prevPosMap = computePositionsAfterStages(results, regularStages, regularStageIndex - 1, allDriverIds);
      }

      // Łączne czasy bez kar
      let cumulativeMap = {};
      if (!isPowerStage && regularStageIndex >= 0) {
        for (const driverId of allDriverIds) {
          let total = 0, valid = true;
          for (let si = 0; si <= regularStageIndex; si++) {
            const sName = regularStages[si], sData = results.stages[sName] || [];
            const dEntry = sData.find(e => e.driverId === driverId);
            if (!dEntry || dEntry.status !== 'OK') { valid = false; break; }
            const t = timeToSeconds(dEntry.time);
            if (t === Infinity) { valid = false; break; }
            total += t;
          }
          cumulativeMap[driverId] = valid ? total : Infinity;
        }
      }

      const sortedResults = [...stageResults].sort((a, b) => {
        const pA = getSortPriority(a.status), pB = getSortPriority(b.status);
        if (pA !== pB) return pA - pB;
        if (!isPowerStage) return (cumulativeMap[a.driverId] ?? Infinity) - (cumulativeMap[b.driverId] ?? Infinity);
        return timeToSeconds(a.time) - timeToSeconds(b.time);
      });

      let leaderTime = null, currentPos = 1, prevCumTime = null;
      for (let i = 0; i < sortedResults.length; i++) {
        const result  = sortedResults[i];
        const useTime = isPowerStage ? timeToSeconds(result.time) : (cumulativeMap[result.driverId] ?? Infinity);
        if (result.status === 'OK' && useTime !== Infinity) {
          if (leaderTime === null) leaderTime = useTime;
          if (i > 0 && prevCumTime !== null && Math.abs(useTime - prevCumTime) < 0.001) result.position = currentPos;
          else { currentPos = i + 1; result.position = currentPos; }
          result.diff     = useTime - leaderTime;
          result.diffPrev = i > 0 && prevCumTime !== null && sortedResults[i-1].status === 'OK' ? useTime - prevCumTime : null;
        } else {
          result.position = null;
          result.diff     = (leaderTime !== null && useTime !== Infinity) ? useTime - leaderTime : Infinity;
          result.diffPrev = null;
        }
        result.cumulativeSeconds = useTime;
        prevCumTime = useTime;
      }

      const powerStagePointsMap = {};
      if (results.calculated?.powerStage) {
        for (const ps of results.calculated.powerStage) powerStagePointsMap[ps.driverId] = ps.points;
      }

      const timeColLabel = isPowerStage ? 'CZAS OS' : 'ŁĄCZNY CZAS';
      let html = `
        <div class="results-card">
          <div class="standings-table standings-table--ss" id="stageTable_${stageIndex}">
            <div class="standings-table__head">
              <div data-sort="pos" data-type="number">POZ.<span class="sort-icon"><svg class="arr-up" width="5" height="4" viewBox="0 0 7 5"><path d="M3.5 0L7 5H0z" fill="currentColor"/></svg><svg class="arr-down" width="5" height="4" viewBox="0 0 7 5"><path d="M3.5 5L0 0H7z" fill="currentColor"/></svg></span></div>
              <div data-sort="driver" data-type="string">KIEROWCA<span class="sort-icon"><svg class="arr-up" width="5" height="4" viewBox="0 0 7 5"><path d="M3.5 0L7 5H0z" fill="currentColor"/></svg><svg class="arr-down" width="5" height="4" viewBox="0 0 7 5"><path d="M3.5 5L0 0H7z" fill="currentColor"/></svg></span></div>
              <div>ZESPÓŁ / AUTO</div>
              <div data-sort="penalty" data-type="number">KARY<span class="sort-icon"><svg class="arr-up" width="5" height="4" viewBox="0 0 7 5"><path d="M3.5 0L7 5H0z" fill="currentColor"/></svg><svg class="arr-down" width="5" height="4" viewBox="0 0 7 5"><path d="M3.5 5L0 0H7z" fill="currentColor"/></svg></span></div>
              <div data-sort="time" data-type="time" class="sort-asc">${timeColLabel}<span class="sort-icon"><svg class="arr-up" width="5" height="4" viewBox="0 0 7 5"><path d="M3.5 0L7 5H0z" fill="currentColor"/></svg><svg class="arr-down" width="5" height="4" viewBox="0 0 7 5"><path d="M3.5 5L0 0H7z" fill="currentColor"/></svg></span></div>
              <div data-sort="diffprev" data-type="time">DIFF. PREV<span class="sort-icon"><svg class="arr-up" width="5" height="4" viewBox="0 0 7 5"><path d="M3.5 0L7 5H0z" fill="currentColor"/></svg><svg class="arr-down" width="5" height="4" viewBox="0 0 7 5"><path d="M3.5 5L0 0H7z" fill="currentColor"/></svg></span></div>
              <div>DIFF.<span class="sort-icon"></span></div>
              <div data-sort="pspoints" data-type="number">${isPowerStage ? 'PUNKTY' : 'BONUS'}<span class="sort-icon"><svg class="arr-up" width="5" height="4" viewBox="0 0 7 5"><path d="M3.5 0L7 5H0z" fill="currentColor"/></svg><svg class="arr-down" width="5" height="4" viewBox="0 0 7 5"><path d="M3.5 5L0 0H7z" fill="currentColor"/></svg></span></div>
            </div>
            <div class="standings-table__body">`;

      for (let i = 0; i < sortedResults.length; i++) {
        const result  = sortedResults[i];
        const driver  = drivers.find(d => d.id === result.driverId);
        const team    = teams.find(t => t.id === driver?.teamId);
        const cumulativePenalty = getCumulativePenalty(allPenalties, stagesToSumPenalties, result.driverId);
        const penaltyDisplay    = cumulativePenalty !== 0 ? (cumulativePenalty > 0 ? `+${cumulativePenalty}s` : `${cumulativePenalty}s`) : '—';
        const cumSecs = result.cumulativeSeconds;
        let timeDisplay;
        if (isPowerStage) {
          if (result.status === 'OK') {
            timeDisplay = result.time;
            if (result.tireChange) timeDisplay = `<span class="time-with-tire">${shortTime(result.time)}<span class="tire-icon" data-tooltip="Zmiana opony podczas OS"><svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><circle cx="12" cy="12" r="11.5"/><circle cx="12" cy="12" r="8.8" fill="var(--color-background-primary,#fff)"/><circle cx="12" cy="12" r="8.1"/><circle cx="12" cy="12" r="7.2" fill="var(--color-background-primary,#fff)"/><line x1="12" y1="7.4" x2="12" y2="4.0" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="12" y1="7.4" x2="12" y2="4.0" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" transform="rotate(45 12 12)"/><line x1="12" y1="7.4" x2="12" y2="4.0" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" transform="rotate(90 12 12)"/><line x1="12" y1="7.4" x2="12" y2="4.0" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" transform="rotate(135 12 12)"/><line x1="12" y1="7.4" x2="12" y2="4.0" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" transform="rotate(180 12 12)"/><line x1="12" y1="7.4" x2="12" y2="4.0" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" transform="rotate(225 12 12)"/><line x1="12" y1="7.4" x2="12" y2="4.0" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" transform="rotate(270 12 12)"/><line x1="12" y1="7.4" x2="12" y2="4.0" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" transform="rotate(315 12 12)"/><circle cx="12" cy="12" r="2.4" fill="var(--color-background-primary,#fff)"/><circle cx="12" cy="12" r="1.6"/></svg></span></span>`;
          } else timeDisplay = result.status;
        } else {
          timeDisplay = (cumSecs !== Infinity && cumSecs !== undefined) ? secondsToTime(cumSecs) : (result.status !== 'OK' ? result.status : '—');
        }

        let bonusOrPointsDisplay = '—';
        if (isPowerStage) {
          const psPoints = powerStagePointsMap[result.driverId] || 0;
          if (psPoints > 0) bonusOrPointsDisplay = `+${psPoints}`;
        } else {
          let cumulativeBonus = 0;
          for (let si = 0; si <= regularStageIndex; si++) {
            const sName = regularStages[si], sData = results.stages?.[sName] || [];
            const dEntry = sData.find(e => e.driverId === result.driverId);
            if (dEntry && dEntry.bonus && dEntry.bonus > 0) cumulativeBonus += dEntry.bonus;
          }
          bonusOrPointsDisplay = cumulativeBonus > 0 ? `+${cumulativeBonus}` : '—';
        }

        const diffDisplay     = formatDiff(result.diff === Infinity ? null : result.diff);
        const diffPrevDisplay = result.diffPrev !== null && result.diffPrev !== undefined ? formatDiff(result.diffPrev) : '—';
        const dataTimeSecs    = cumSecs !== undefined ? cumSecs : Infinity;
        const prevPos         = isPowerStage ? null : (prevPosMap[result.driverId] ?? null);
        const posCellHtml     = isPowerStage ? (result.position !== null ? result.position : '—') : buildPosCellHtml(result.position, prevPos);

        html += `
          <div class="standings-row"
            data-pos="${result.position !== null ? result.position : 999}"
            data-driver-name="${driver?.name || result.driverId}"
            data-time-seconds="${dataTimeSecs}"
            data-penalty-value="${cumulativePenalty}"
            data-diff="${result.diff === Infinity ? 999 : (result.diff ?? 999)}"
            data-diff-prev="${result.diffPrev !== null && result.diffPrev !== undefined ? result.diffPrev : 999}"
            data-ps-points="${isPowerStage ? (powerStagePointsMap[result.driverId] || 0) : 0}"
            data-status="${result.status}">
            <div class="col-pos">${posCellHtml}</div>
            <div class="col-driver">
              <span class="flag-emoji">${getFlagEmoji(driver?.country || 'pl')}</span>
              <span>${driver?.name || result.driverId}</span>
            </div>
            <div class="col-team-logo">
              <img class="team-logo-tooltip" data-team-name="${team?.name || '-'}" src="${team?.logo || 'assets/teams/default.png'}" alt="${team?.name || '-'}" onerror="this.src='assets/teams/default.png'" style="width:28px;height:28px;object-fit:contain;" />
              <span class="col-car-model">${driver?.carModel || team?.carModel || '-'}</span>
            </div>
            <div class="col-penalty penalty-value">${penaltyDisplay}</div>
            <div class="col-total stage-status-cell">${timeDisplay}</div>
            <div class="col-diff-prev">${diffPrevDisplay}</div>
            <div class="col-diff">${diffDisplay}</div>
            <div class="col-bonus bonus-value">${bonusOrPointsDisplay}</div>
          </div>`;
      }

      html += `</div></div></div>`;
      let stagePanel = document.querySelector(`.tab-panel[data-panel="stage_${stageIndex}"]`);
      if (!stagePanel) {
        stagePanel = document.createElement('div');
        stagePanel.className = 'tab-panel';
        stagePanel.setAttribute('data-panel', `stage_${stageIndex}`);
        document.querySelector('.table-section').appendChild(stagePanel);
      }
      stagePanel.innerHTML = html;
      document.querySelector('.tab-panel[data-panel="lacznie"]').classList.remove('active');
      initStageSorting(stagePanel.querySelector('.standings-table'), isPowerStage);
    }
    
    function initStageSorting(table, isPowerStage = false) {
      if (!table) return;
      const head = table.querySelector('.standings-table__head');
      const body = table.querySelector('.standings-table__body');
      if (!head || !body) return;
      const sortableColumns = Array.from(head.querySelectorAll('[data-sort]'));
      let currentSort = { column: 'time', direction: 'asc' };
      const timeColumn = head.querySelector('[data-sort="time"]');
      if (timeColumn) timeColumn.classList.add('sort-asc');
      function getStageSortValue(row, columnKey) {
        const priority = getSortPriority(row.dataset.status);
        if (columnKey === 'pos')      return parseFloat(row.dataset.pos) || 999;
        if (columnKey === 'time')     return priority * 1e9 + (parseFloat(row.dataset.timeSeconds) || Infinity);
        if (columnKey === 'penalty')  return parseFloat(row.dataset.penaltyValue) || 0;
        if (columnKey === 'pspoints') return parseFloat(row.dataset.psPoints) || 0;
        if (columnKey === 'diffprev') { const v = parseFloat(row.dataset.diffPrev); return isNaN(v) || v === 999 ? Infinity : v; }
        return 0;
      }
      function sortStageTable(columnKey, sortType, direction) {
        const rows = Array.from(body.querySelectorAll('.standings-row'));
        rows.sort((a, b) => {
          if (columnKey === 'driver') return direction === 'asc' ? (a.dataset.driverName || '').localeCompare(b.dataset.driverName || '', 'pl') : (b.dataset.driverName || '').localeCompare(a.dataset.driverName || '', 'pl');
          const vA = getStageSortValue(a, columnKey), vB = getStageSortValue(b, columnKey);
          return direction === 'asc' ? vA - vB : vB - vA;
        });
        rows.forEach(row => body.appendChild(row));
        const updatedRows = Array.from(body.querySelectorAll('.standings-row'));
        let curPos = 1, prevT = null, leaderT = null;
        updatedRows.forEach((row, i) => {
          const priority  = getSortPriority(row.dataset.status);
          const timeValue = parseFloat(row.dataset.timeSeconds) || Infinity;
          const posCell   = row.querySelector('.col-pos');
          const diffCell  = row.querySelector('.col-diff');
          const diffPrevCell = row.querySelector('.col-diff-prev');
          if (priority === 0 && timeValue !== Infinity) {
            if (i === 0) leaderT = timeValue;
            if (i > 0 && prevT !== null && Math.abs(timeValue - prevT) < 0.001) {
              const numSpan = posCell.querySelector('.pos-number');
              if (numSpan) numSpan.textContent = curPos; else posCell.textContent = curPos;
              row.dataset.pos = curPos;
            } else {
              curPos = i + 1;
              const numSpan = posCell.querySelector('.pos-number');
              if (numSpan) numSpan.textContent = curPos; else posCell.textContent = curPos;
              row.dataset.pos = curPos;
            }
            if (diffCell) { const diff = timeValue - leaderT; diffCell.textContent = diff === 0 ? '—' : formatDiff(diff); }
            if (diffPrevCell) {
              if (i === 0) { diffPrevCell.textContent = '—'; row.dataset.diffPrev = 999; }
              else {
                const prevRow = updatedRows[i - 1], prevTime = parseFloat(prevRow.dataset.timeSeconds) || Infinity;
                if (prevRow.dataset.status === 'OK' && prevTime !== Infinity) { const dp = timeValue - prevTime; diffPrevCell.textContent = formatDiff(dp); row.dataset.diffPrev = dp; }
                else { diffPrevCell.textContent = '—'; row.dataset.diffPrev = 999; }
              }
            }
          } else if (priority > 0 && timeValue !== Infinity && leaderT !== null) {
            posCell.textContent = '—'; row.dataset.pos = 999;
            if (diffCell) diffCell.textContent = formatDiff(timeValue - leaderT);
            if (diffPrevCell) { diffPrevCell.textContent = '—'; row.dataset.diffPrev = 999; }
          } else {
            posCell.textContent = '—'; row.dataset.pos = 999;
            if (diffCell) diffCell.textContent = '—';
            if (diffPrevCell) { diffPrevCell.textContent = '—'; row.dataset.diffPrev = 999; }
          }
          prevT = timeValue;
        });
      }
      sortableColumns.forEach(col => {
        col.addEventListener('click', (e) => {
          e.stopPropagation();
          const columnKey = col.dataset.sort, sortType = col.dataset.type;
          sortableColumns.forEach(c => c.classList.remove('sort-asc', 'sort-desc'));
          const direction = currentSort.column === columnKey ? (currentSort.direction === 'asc' ? 'desc' : 'asc') : 'asc';
          currentSort = { column: columnKey, direction };
          col.classList.add(direction === 'asc' ? 'sort-asc' : 'sort-desc');
          sortStageTable(columnKey, sortType, direction);
        });
      });
      sortStageTable('time', 'time', 'asc');
    }
    
    (function(){
      document.body.classList.add('no-transition');
      if(localStorage.getItem('wrc-theme')==='dark') document.body.classList.add('dark');
      document.documentElement.classList.remove('wrc-dark');
      requestAnimationFrame(function(){ requestAnimationFrame(function(){ document.body.classList.remove('no-transition'); }); });
      var btn = document.getElementById('themeToggle');
      if(btn){
        btn.addEventListener('click', function(){
          document.body.classList.add('theme-animating');
          var isDark = document.body.classList.toggle('dark');
          localStorage.setItem('wrc-theme', isDark ? 'dark' : 'light');
          setTimeout(function(){ document.body.classList.remove('theme-animating'); }, 420);
        });
      }
    })();
    
    loadRallyResults();
  </script>
</body>
</html>
