  <script>
    // Cache danych po załadowaniu
    let cachedData = null;
    let dataLoaded = false;
    let loadingPromise = null;
    let loadedTabs = new Set();
    
    // Funkcja do konwersji kodu kraju na emoji flagi
    function getFlagEmoji(countryCode) {
      if (!countryCode) return '🏁';
      const specialFlags = {
        'wls': '🏴󠁧󠁢󠁷󠁬󠁳󠁿', 'sct': '🏴󠁧󠁢󠁳󠁣󠁴󠁿', 'eng': '🏴󠁧󠁢󠁥󠁮󠁧󠁿', 'gb': '🇬🇧',
        'gb-eng': '🏴󠁧󠁢󠁥󠁮󠁧󠁿', 'gb-sct': '🏴󠁧󠁢󠁳󠁣󠁴󠁿', 'gb-wls': '🏴󠁧󠁢󠁷󠁬󠁳󠁿'
      };
      const code = countryCode.toLowerCase();
      if (specialFlags[code]) return specialFlags[code];
      if (code.length === 2) {
        try {
          const codePoints = code.toUpperCase().split('').map(char => 127397 + char.charCodeAt());
          return String.fromCodePoint(...codePoints);
        } catch(e) { return '🏁'; }
      }
      return '🏁';
    }
    
    // Funkcja tworząca link do strony kierowcy
    function getDriverLink(driverName, driverId) {
      let slug = driverName.toLowerCase()
        .replace(/ł/g, 'l').replace(/ą/g, 'a').replace(/ć/g, 'c')
        .replace(/ę/g, 'e').replace(/ń/g, 'n').replace(/ó/g, 'o')
        .replace(/ś/g, 's').replace(/ź/g, 'z').replace(/ż/g, 'z')
        .replace(/\s+/g, '_').replace(/[^a-z0-9_]/g, '');
      if (driverId) slug = driverId;
      return `<a href="${slug}.html" class="driver-link">${driverName}</a>`;
    }

    // Funkcja do pobierania URL loga z obsługą błędów
    function getTeamLogoUrl(teamLogo, teamName) {
      if (!teamLogo) return 'assets/teams/default.png';
      
      // Jeśli logo to pełny URL (zaczyna się od http:// lub https://)
      if (teamLogo.startsWith('http://') || teamLogo.startsWith('https://')) {
        return teamLogo;
      }
      
      // Jeśli logo to ścieżka względna
      return teamLogo;
    }

    // Główna funkcja ładująca dane
    async function loadBaseData() {
      if (loadingPromise) return loadingPromise;
      if (dataLoaded && cachedData) return cachedData;
      
      loadingPromise = (async () => {
        try {
          const activePanel = document.querySelector('.index-tab-panel.active');
          if (activePanel) {
            const body = activePanel.querySelector('.standings-table__body, .results-table__body');
            if (body) body.innerHTML = '<div class="loading-spinner"></div>';
          }
          
          await api.loadData();
          const rawData = api.data;
          let calendar = await api.getCalendar();
          
          calendar = getSortedCalendar(calendar, rawData);
          
          if (!calendar || calendar.length === 0) {
            throw new Error('Brak danych');
          }
          
          const standings = await api.calculateAllStandings();
          const drivers = await api.getDrivers();
          const teams = await api.getTeams();
          
          // Pobierz loga dla każdego zespołu
          const teamsWithLogos = teams.map(team => ({
            ...team,
            logoUrl: getTeamLogoUrl(team.logo, team.name)
          }));
          
          cachedData = {
            calendar,
            drivers,
            teams: teamsWithLogos,
            championship: standings.championship,
            constructors: standings.constructors,
            powerStage: standings.powerStage,
            driverMap: new Map(drivers.map(d => [d.id, d]))
          };
          
          dataLoaded = true;
          return cachedData;
        } catch (error) {
          console.error('Error loading data:', error);
          throw error;
        } finally {
          loadingPromise = null;
        }
      })();
      
      return loadingPromise;
    }
    
    // Funkcja do ładowania konkretnej tabeli
    async function loadTabData(tabName) {
      if (loadedTabs.has(tabName)) return;
      
      const data = await loadBaseData();
      
      switch(tabName) {
        case 'results':
          await loadResultsTable(data.calendar, data.driverMap);
          break;
        case 'championship':
          await loadChampionshipTable(data.championship, data.drivers, data.teams, data.calendar);
          break;
        case 'super-sunday':
          await loadConstructorsTable(data.constructors, data.calendar);
          break;
        case 'power-stage':
          await loadPowerStageTable(data.powerStage, data.calendar, data.drivers, data.teams, data.driverMap);
          break;
      }
      loadedTabs.add(tabName);
    }
    
    function getCalendarGroupedByDate(calendar) {
      const groups = {};
      calendar.forEach(rally => {
        const dateKey = rally.startDate;
        if (!groups[dateKey]) groups[dateKey] = [];
        groups[dateKey].push(rally);
      });
      const sortedDates = Object.keys(groups).sort();
      return { groups, sortedDates };
    }
    
    function getStoredOrderForDate(data, dateKey) {
      const season = data?.seasons?.[data?.settings?.currentSeason];
      const order = season?.calendarOrder || {};
      return order[dateKey] || [];
    }
    
    function getSortedCalendar(calendar, rawData) {
      if (!calendar || calendar.length === 0) return [];
      if (!rawData) return [...calendar];
      
      const { groups, sortedDates } = getCalendarGroupedByDate(calendar);
      const result = [];
      
      for (const date of sortedDates) {
        const rallies = groups[date];
        const storedOrder = getStoredOrderForDate(rawData, date);
        
        if (storedOrder.length === rallies.length && storedOrder.every(id => rallies.some(r => r.id === id))) {
          const ordered = [];
          for (const id of storedOrder) {
            const rally = rallies.find(r => r.id === id);
            if (rally) ordered.push(rally);
          }
          for (const rally of rallies) {
            if (!ordered.includes(rally)) ordered.push(rally);
          }
          result.push(...ordered);
        } else {
          result.push(...rallies.sort((a, b) => a.name.localeCompare(b.name)));
        }
      }
      return result;
    }

    async function loadResultsTable(calendar, driverMap) {
      const tbody = document.getElementById('resultsTableBody');
      let html = '';
      for (let index = 0; index < calendar.length; index++) {
        const rally = calendar[index];
        const round = index + 1;
        const statusText = getStatusText(rally.status);
        let winner = '', winnerCountry = '', winnerId = '';
        if (rally.status === 'completed') {
          const calculated = await api.calculateRallyResults(rally.id);
          if (calculated?.overall && calculated.overall.length > 0) {
            const firstPlace = calculated.overall.find(r => r.status !== 'DSQ' && r.status !== '—');
            if (firstPlace) { 
              winner = firstPlace.driverName; 
              winnerCountry = firstPlace.driverCountry;
              winnerId = firstPlace.driverId;
            }
          }
        }
        const winnerDisplay = winner ? 
          `<span class="flag-emoji">${getFlagEmoji(winnerCountry)}</span>${getDriverLink(winner, winnerId)}` : '';
        
        html += `<div class="results-row">
          <div class="col-round">${round}</div>
          <div class="col-rally"><span class="flag-emoji">${getFlagEmoji(rally.country)}</span><span>${rally.name}</span></div>
          <div class="col-date">${formatDateRange(rally.startDate, rally.endDate)}</div>
          <div class="col-status">${statusText}</div>
          <div class="col-winner">${winnerDisplay}</div>
          <div class="col-results">${(rally.status === 'completed' || rally.status === 'ongoing') ? `<a href="wyniki.html?rally=${rally.id}" class="results-link">Pełne wyniki</a>` : ''}</div>
        </div>`;
      }
      tbody.innerHTML = html;
    }
    
    async function loadChampionshipTable(championship, drivers, teams, calendar) {
      const head = document.getElementById('championshipHead');

      if (!championship || championship.length === 0) { body.innerHTML = '<div class="loading-spinner"></div>'; return; }

        <div data-sort="driver" data-type="str">KIEROWCA<span class="sort-icon"><svg class="arr-up" width="5" height="4" viewBox="0 0 7 5"><path d="M3.5 0L7 5H0z" fill="currentColor"/></svg><svg class="arr-down" width="5" height="4" viewBox="0 0 7 5"><path d="M3.5 5L0 0H7z" fill="currentColor"/></svg></span></div>
        <div>ZESPÓŁ</div>`;
      
      calendar.forEach(rally => { 
        headHtml += `<div><span class="fi fi-${rally.country} flag flag-clickable" data-rally-id="${rally.id}" title="${rally.name}"></span></div>`; 
      });
      
      headHtml += `<div data-sort="total" data-type="num">SUMA<span class="sort-icon"><svg class="arr-up" width="5" height="4" viewBox="0 0 7 5"><path d="M3.5 0L7 5H0z" fill="currentColor"/></svg><svg class="arr-down" width="5" height="4" viewBox="0 0 7 5"><path d="M3.5 5L0 0H7z" fill="currentColor"/></svg></span></div>
        <div data-sort="diff" data-type="num">DIFF.<span class="sort-icon"><svg class="arr-up" width="5" height="4" viewBox="0 0 7 5"><path d="M3.5 0L7 5H0z" fill="currentColor"/></svg><svg class="arr-down" width="5" height="4" viewBox="0 0 7 5"><path d="M3.5 5L0 0H7z" fill="currentColor"/></svg></span></div>`;
      head.innerHTML = headHtml;
      
      document.querySelectorAll('#championshipHead .flag-clickable').forEach(flag => {
        flag.addEventListener('click', (e) => { e.stopPropagation(); const rallyId = flag.dataset.rallyId; if (rallyId) window.location.href = `wyniki.html?rally=${rallyId}`; });
      });
      
      let bodyHtml = '';
      for (const driverStanding of championship) {
        const driver = drivers.find(d => d.id === driverStanding.driverId);
        const team = teams.find(t => t.id === driver?.teamId);
        const driverLink = getDriverLink(driverStanding.driverName, driverStanding.driverId);
        const teamLogoUrl = team?.logoUrl || 'assets/teams/default.png';
        
        bodyHtml += `<div class="standings-row" data-pos="${driverStanding.position}" data-total="${driverStanding.totalPoints}" data-diff="${driverStanding.diff}" data-driver="${driverStanding.driverName}">
          <div class="col-pos">${driverStanding.position}</div>
          <div class="col-driver"><span class="flag-emoji">${getFlagEmoji(driverStanding.driverCountry)}</span><span class="driver-name">${driverLink}</span></div>
          <div class="col-team-logo team-logo-tooltip" data-team-name="${team?.name || '-'}">
            <img src="${teamLogoUrl}" alt="${team?.name || '-'}" onerror="this.src='assets/teams/default.png'" />
          </div>`;
        
        for (const rally of calendar) {
          const rallyDetail = driverStanding.rallyDetails?.find(rd => rd.rallyId === rally.id);
          let displayText = '—', tooltipText = '', hasPoints = false;
          if (rallyDetail && rallyDetail.points > 0) {
            const details = rallyDetail.details || [];
            const racePoints = details.find(d => d.type === 'Position')?.points || 0;
            const bonusPoints = details.find(d => d.type === 'Bonus')?.points || 0;
            const psPoints = details.find(d => d.type === 'Power Stage')?.points || 0;
            const extraPoints = details.find(d => d.type === 'Extra')?.points || 0;
            const parts = [];
            if (racePoints > 0) parts.push(racePoints);
            if (bonusPoints > 0) parts.push(bonusPoints);
            if (psPoints > 0) parts.push(psPoints);
            if (extraPoints > 0) parts.push(extraPoints);
            if (parts.length > 0) { displayText = parts.join(' + '); hasPoints = true; }
            const tooltipParts = [];
            if (racePoints > 0) tooltipParts.push(`Rajd: ${racePoints}`);
            if (bonusPoints > 0) tooltipParts.push(`Bonus: ${bonusPoints}`);
            if (psPoints > 0) tooltipParts.push(`Power Stage: ${psPoints}`);
            if (extraPoints > 0) tooltipParts.push(`Dodatkowe: ${extraPoints}`);
            if (tooltipParts.length > 0) tooltipText = tooltipParts.join('\n');
          }
          const tooltipClass = hasPoints ? (tooltipText.includes('\n') ? 'points-tooltip multiline' : 'points-tooltip') : '';
          const safeTooltipText = tooltipText.replace(/"/g, '&quot;');
          bodyHtml += `<div class="${tooltipClass}" ${hasPoints ? `data-tooltip="${safeTooltipText}"` : ''}>${displayText}</div>`;
        }
        bodyHtml += `<div class="col-total">${driverStanding.totalPoints}</div><div class="col-diff">${driverStanding.diff === 0 ? '—' : `-${driverStanding.diff}`}</div></div>`;
      }
      body.innerHTML = bodyHtml;
      initSorting(document.querySelector('#championshipTable'));
    }
    
    async function loadConstructorsTable(constructors, calendar) {
      const head = document.getElementById('constructorsHead');
      const body = document.getElementById('constructorsBody');
      if (!constructors || constructors.length === 0) { body.innerHTML = '<div class="loading-spinner"></div>'; return; }
      
      let headHtml = `<div data-sort="pos" data-type="num" class="sort-asc">POZ.<span class="sort-icon"><svg class="arr-up" width="5" height="4" viewBox="0 0 7 5"><path d="M3.5 0L7 5H0z" fill="currentColor"/></svg><svg class="arr-down" width="5" height="4" viewBox="0 0 7 5"><path d="M3.5 5L0 0H7z" fill="currentColor"/></svg></span></div>
        <div>ZESPÓŁ</div>`;
      
      calendar.forEach(rally => { 
        headHtml += `<div><span class="fi fi-${rally.country} flag flag-clickable" data-rally-id="${rally.id}" title="${rally.name}"></span></div>`; 
      });
      
      headHtml += `<div data-sort="total" data-type="num">SUMA<span class="sort-icon"><svg class="arr-up" width="5" height="4" viewBox="0 0 7 5"><path d="M3.5 0L7 5H0z" fill="currentColor"/></svg><svg class="arr-down" width="5" height="4" viewBox="0 0 7 5"><path d="M3.5 5L0 0H7z" fill="currentColor"/></svg></span></div>
        <div data-sort="diff" data-type="num">DIFF.<span class="sort-icon"><svg class="arr-up" width="5" height="4" viewBox="0 0 7 5"><path d="M3.5 0L7 5H0z" fill="currentColor"/></svg><svg class="arr-down" width="5" height="4" viewBox="0 0 7 5"><path d="M3.5 5L0 0H7z" fill="currentColor"/></svg></span></div>`;
      head.innerHTML = headHtml;
      
      document.querySelectorAll('#constructorsHead .flag-clickable').forEach(flag => {
        flag.addEventListener('click', (e) => { e.stopPropagation(); const rallyId = flag.dataset.rallyId; if (rallyId) window.location.href = `wyniki.html?rally=${rallyId}`; });
      });
      
      let bodyHtml = '';
      for (const teamStanding of constructors) {
        const teamLogoUrl = getTeamLogoUrl(teamStanding.teamLogo, teamStanding.teamName);
        
        bodyHtml += `<div class="standings-row" data-pos="${teamStanding.position}" data-total="${teamStanding.totalPoints}" data-diff="${teamStanding.diff}">
          <div class="col-pos">${teamStanding.position}</div>
          <div class="col-team-logo-constructor team-logo-tooltip" data-team-name="${teamStanding.teamName}">
            <img src="${teamLogoUrl}" alt="${teamStanding.teamName}" onerror="this.src='assets/teams/default.png'" style="width:32px;height:32px;object-fit:contain;" />
          </div>`;
        
        for (const rally of calendar) {
          const rallyDetail = teamStanding.rallyDetails?.find(rd => rd.rallyId === rally.id);
          let displayText = '—', tooltipText = '', hasPoints = false;
          if (rallyDetail && rallyDetail.points > 0) {
            const breakdown = rallyDetail.driverPoints?.map(dp => dp.points).join(' + ');
            if (breakdown) { displayText = breakdown; hasPoints = true; tooltipText = rallyDetail.driverPoints?.map(dp => `${dp.driverName}: ${dp.points}`).join('\n') || breakdown; }
            else { displayText = `${rallyDetail.points}`; hasPoints = true; tooltipText = `${rallyDetail.points}`; }
          }
          const tooltipClass = hasPoints ? (tooltipText.includes('\n') ? 'points-tooltip--above multiline' : 'points-tooltip--above') : '';
          const safeTooltipText = tooltipText.replace(/"/g, '&quot;');
          bodyHtml += `<div class="${tooltipClass}" ${hasPoints ? `data-tooltip="${safeTooltipText}"` : ''}>${displayText}</div>`;
        }
        bodyHtml += `<div class="col-total">${teamStanding.totalPoints}</div><div class="col-diff">${teamStanding.diff === 0 ? '—' : `-${teamStanding.diff}`}</div></div>`;
      }
      body.innerHTML = bodyHtml;
      initSorting(document.querySelector('#constructorsTable'));

    async function loadPowerStageTable(powerStageStandings, calendar, drivers, teams, driverMap) {

      let headHtml = `<div data-sort="pos" data-type="num" class="sort-asc">POZ.<span class="sort-icon"><svg class="arr-up" width="5" height="4" viewBox="0 0 7 5"><path d="M3.5 0L7 5H0z" fill="currentColor"/></svg><svg class="arr-down" width="5" height="4" viewBox="0 0 7 5"><path d="M3.5 5L0 0H7z" fill="currentColor"/></svg></span></div>
        <div data-sort="driver" data-type="str">KIEROWCA<span class="sort-icon"><svg class="arr-up" width="5" height="4" viewBox="0 0 7 5"><path d="M3.5 0L7 5H0z" fill="currentColor"/></svg><svg class="arr-down" width="5" height="4" viewBox="0 0 7 5"><path d="M3.5 5L0 0H7z" fill="currentColor"/></svg></span></div>
        <div>ZESPÓŁ</div>`;
      
      calendar.forEach(rally => { 
        headHtml += `<div><span class="fi fi-${rally.country} flag flag-clickable" data-rally-id="${rally.id}" title="Kliknij, aby zobaczyć wyniki ${rally.name}"></span></div>`; 
      });
      
      headHtml += `<div data-sort="total" data-type="num">SUMA<span class="sort-icon"><svg class="arr-up" width="5" height="4" viewBox="0 0 7 5"><path d="M3.5 0L7 5H0z" fill="currentColor"/></svg><svg class="arr-down" width="5" height="4" viewBox="0 0 7 5"><path d="M3.5 5L0 0H7z" fill="currentColor"/></svg></span></div>
        <div data-sort="diff" data-type="num">DIFF.<span class="sort-icon"><svg class="arr-up" width="5" height="4" viewBox="0 0 7 5"><path d="M3.5 0L7 5H0z" fill="currentColor"/></svg><svg class="arr-down" width="5" height="4" viewBox="0 0 7 5"><path d="M3.5 5L0 0H7z" fill="currentColor"/></svg></span></div>`;
      head.innerHTML = headHtml;
      
      document.querySelectorAll('#powerStageHead .flag-clickable').forEach(flag => {
        flag.addEventListener('click', (e) => { e.stopPropagation(); const rallyId = flag.dataset.rallyId; if (rallyId) window.location.href = `wyniki.html?rally=${rallyId}`; });
      });
      
      let bodyHtml = '';
      for (const standing of powerStageStandings) {
        const team = teams.find(t => t.id === standing.teamId);
        const driverLink = getDriverLink(standing.driverName, standing.driverId);
        const teamLogoUrl = team?.logoUrl || 'assets/teams/default.png';
        
        bodyHtml += `<div class="standings-row" data-pos="${standing.position}" data-total="${standing.totalPoints}" data-diff="${standing.diff}" data-driver="${standing.driverName}">
          <div class="col-pos">${standing.position}</div>
          <div class="col-driver"><span class="flag-emoji">${getFlagEmoji(standing.driverCountry)}</span><span>${driverLink}</span></div>

      initSorting(document.querySelector('#powerStageTable'));

    function formatDateRange(start, end) {
      const startDate = new Date(start), endDate = new Date(end);
      const sameDay = startDate.toDateString() === endDate.toDateString();
      const monthNames = { 'sty': 'STYCZNIA', 'lut': 'LUTEGO', 'mar': 'MARCA', 'kwi': 'KWIETNIA', 'maj': 'MAJA', 'cze': 'CZERWCA', 'lip': 'LIPCA', 'sie': 'SIERPNIA', 'wrz': 'WRZEŚNIA', 'paź': 'PAŹDZIERNIKA', 'lis': 'LISTOPADA', 'gru': 'GRUDNIA' };
      function formatDate(date) {
        const day = date.getDate();
        const monthShort = date.toLocaleDateString('pl-PL', { month: 'short' }).replace('.', '').toLowerCase();
        const month = monthNames[monthShort] || monthShort.toUpperCase();
        return `${day} ${month} ${date.getFullYear()}`;
      }
      function formatShortDate(date) {
        const day = date.getDate();
        const monthShort = date.toLocaleDateString('pl-PL', { month: 'short' }).replace('.', '').toLowerCase();
        const month = monthNames[monthShort] || monthShort.toUpperCase();
        return `${day} ${month}`;
      }
      if (sameDay) return formatDate(startDate);
      return `${formatShortDate(startDate)} – ${formatDate(endDate)}`;
    }

    function getStatusText(status) {
      switch(status) {
        case 'completed': return 'ZAKOŃCZONY';
        case 'ongoing': return 'TRWA';
        default: return '';
      }
    }
    
    function initSorting(table) {
      if (!table) return;
      const head = table.querySelector('.standings-table__head');
      const body = table.querySelector('.standings-table__body');
      if (!head || !body) return;
      const allEls = Array.from(head.querySelectorAll('[data-sort]'));
      let cur = { key: 'pos', dir: 'asc' };
      function applySort(activeEl, key, type, dir) {
        allEls.forEach(c => c.classList.remove('sort-asc', 'sort-desc'));
        activeEl.classList.add(dir === 'asc' ? 'sort-asc' : 'sort-desc');
        const rows = Array.from(body.querySelectorAll('.standings-row'));
        rows.sort((a, b) => {
          let va = a.dataset[key] || '', vb = b.dataset[key] || '';
          let cmp;
          if (type === 'num') cmp = (parseFloat(va) || 0) - (parseFloat(vb) || 0);
          else cmp = va.localeCompare(vb, 'pl');
          return dir === 'asc' ? cmp : -cmp;
        });
        rows.forEach(r => body.appendChild(r));
      }
      allEls.forEach(el => {
        el.addEventListener('click', (e) => {
          e.stopPropagation();
          const k = el.dataset.sort;
          const t = el.dataset.type;
          cur.dir = (cur.key === k) ? (cur.dir === 'asc' ? 'desc' : 'asc') : 'asc';
          cur.key = k;
          applySort(el, k, t, cur.dir);
        });
      });
    }
    
    // Obsługa przełączania zakładek z leniwym ładowaniem
    const tabButtons = document.querySelectorAll(".tab");
    const panelsList = document.querySelectorAll(".index-tab-panel");
    
    tabButtons.forEach((tab) => {
      tab.addEventListener("click", async () => {
        const target = tab.dataset.tab;
        if (!target) return;
        
        tabButtons.forEach((t) => t.classList.remove("active"));
        panelsList.forEach((p) => p.classList.remove("active"));
        tab.classList.add("active");
        const targetPanel = document.querySelector(`.index-tab-panel[data-panel="${target}"]`);
        if (targetPanel) targetPanel.classList.add("active");
        
        await loadTabData(target);
      });
    });
    
    // Inicjalizacja
    (async function init() {
      document.body.classList.add('no-transition');
      if(localStorage.getItem('wrc-theme')==='dark') document.body.classList.add('dark');
      document.documentElement.classList.remove('wrc-dark');
      requestAnimationFrame(function(){ requestAnimationFrame(function(){ document.body.classList.remove('no-transition'); }); });
      
      const btn = document.getElementById('themeToggle');
      if(btn){
        btn.addEventListener('click', function(){
          document.body.classList.add('theme-animating');
          var isDark = document.body.classList.toggle('dark');
          localStorage.setItem('wrc-theme', isDark ? 'dark' : 'light');
          setTimeout(function(){ document.body.classList.remove('theme-animating'); }, 420);
        });
      }
      
      const logo = document.querySelector(".floating-logo");
      const hero = document.querySelector(".hero");
      function updateLogo() { logo.classList.toggle("logo--dark", hero.getBoundingClientRect().bottom <= 0); }
      window.addEventListener("scroll", updateLogo, { passive: true });
      updateLogo();
      
      await loadBaseData();
      const activeTab = document.querySelector('.tab.active');
      const activeTabName = activeTab ? activeTab.dataset.tab : 'results';
      await loadTabData(activeTabName);
    })();
  </script>
