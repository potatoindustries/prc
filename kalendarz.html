  <style>
    @font-face {
      font-family: "SebinoBold";
      src: url("assets/fonts/sebino-bold.ttf") format("truetype");
      font-weight: normal;
      font-style: normal;
    }
    
    .flag-emoji {
      font-size: 1em;
      line-height: 1;
      display: inline-block;
      vertical-align: middle;
      margin-right: 0px;
    }
    
    .season-tabs .fi {
      font-size: 14px;
      vertical-align: middle;
      margin-right: 0px;
    }

    html.wrc-dark,html.wrc-dark body,html.wrc-dark .page{background:#1a1a1a!important}
    
    .loading-spinner {
      text-align: center;
      padding: 60px;
      color: var(--text-muted);
      font-size: 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .loading-spinner::after {
      content: "";
      width: 32px;
      height: 32px;
      border: 3px solid rgba(128, 128, 128, 0.2);
      border-top-color: #9e9e9e;
      border-radius: 50%;
      display: inline-block;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .rally-card__status--happening { color: var(--orange); }
    .rally-card__status--past { color: var(--text-muted); }
    .rally-card__status--cancelled { color: #dc2626; }
    
    .status-ongoing .rally-card__status { color: var(--orange); }
    .status-completed .rally-card__status { color: var(--text-muted); }
    .status-upcoming .rally-card__status { color: var(--text-muted); }
    .status-cancelled .rally-card__status { color: #dc2626; }

    /* ── STYLE NAVBAR ── */
    .topbar {
      align-items: center !important;
      grid-template-columns: 180px auto 170px !important;
      justify-content: space-between !important;
    }

    .topbar__center {
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
      width: auto !important;
      flex: 0 0 auto !important;
      gap: 0 !important;
      background: rgba(28, 28, 28, 0.58) !important;
      backdrop-filter: blur(8px) saturate(1.3) !important;
      -webkit-backdrop-filter: blur(8px) saturate(1.3) !important;
      border-radius: 999px !important;
      border: 1px solid rgba(255,255,255,0.14) !important;
      padding: 3px 20px !important;
      transform: translateY(-3px) !important;
      background: rgba(28, 28, 28, 0.45) !important;
    }

    .topbar__link {
      font-family: "SebinoMedium", "SebinoSoft", Arial, sans-serif !important;
      font-weight: 500 !important;
      color: rgba(255,255,255,0.88) !important;
      text-decoration: none !important;
      font-size: 15px !important;
      letter-spacing: 0.01em !important;
      padding: 10px 20px !important;
      height: auto !important;
      border-radius: 999px !important;
      transition: color 0.15s ease !important;
      white-space: nowrap !important;
      position: relative !important;
      line-height: 1 !important;
    }

    .topbar__link::before {
      content: "" !important;
      position: absolute !important;
      inset: 0 !important;
      border-radius: 999px !important;
      background: rgba(255,255,255,0.10) !important;
      opacity: 0 !important;
      transform: scale(0.82) !important;
      transition: opacity 0.18s ease, transform 0.18s ease !important;
      pointer-events: none !important;
    }

    .topbar__link:first-child {
      border-radius: 999px !important;
      margin-left: -7px !important;
    }
    .topbar__link:first-child::before {
      left: -10px !important;
      right: 0 !important;
      border-radius: 999px !important;
    }
    .topbar__link:last-child {
      border-radius: 999px !important;
      margin-right: -7px !important;
    }
    .topbar__link:last-child::before {
      right: -10px !important;
      left: 0 !important;
      border-radius: 999px !important;
    }

    .topbar__link:hover::before {
      opacity: 1 !important;
      transform: scale(1) !important;
    }

    .topbar__link:hover {
      color: #fff !important;
    }

    .topbar__link::after {
      content: "" !important;
      position: absolute !important;
      left: 50% !important;
      bottom: 1px !important;
      width: 0 !important;
      height: 2px !important;
      border-radius: 1000px !important;
      background: var(--orange) !important;
      transform: translateX(-50%) !important;
      opacity: 0 !important;
      transition: width 0.24s ease, opacity 0.2s ease !important;
      display: block !important;
    }

    .topbar__link:hover::after {
      width: 0 !important;
      opacity: 0 !important;
    }

    .topbar__link.active {
      background: transparent !important;
      color: #fff !important;
    }

    .topbar__link.active::after {
      width: calc(100% - 40px) !important;
      opacity: 1 !important;
    }

  <script>
    // ============================================================
    // OPTYMALIZACJA KALENDARZA - TYLKO JEDNO ŻĄDANIE NA SESJĘ
    // ============================================================
    
    // Cache danych
    let cachedCalendar = null;
    let dataLoaded = false;
    let loadingPromise = null;
    let currentPanel = 'wrc2026';
    
    function getFlagEmoji(countryCode) {
      if (!countryCode) return '🏁';
      
      const specialFlags = {
        'wls': '🏴󠁧󠁢󠁷󠁬󠁳󠁿',
        'sct': '🏴󠁧󠁢󠁳󠁣󠁴󠁿',
        'eng': '🏴󠁧󠁢󠁥󠁮󠁧󠁿',
        'gb': '🇬🇧',
        'gb-eng': '🏴󠁧󠁢󠁥󠁮󠁧󠁿',
        'gb-sct': '🏴󠁧󠁢󠁳󠁣󠁴󠁿',
        'gb-wls': '🏴󠁧󠁢󠁷󠁬󠁳󠁿'
      };
      
      const code = countryCode.toLowerCase();
      if (specialFlags[code]) return specialFlags[code];
      
      if (code.length === 2) {
        try {
          const codePoints = code.toUpperCase().split('').map(char => 127397 + char.charCodeAt());
          return String.fromCodePoint(...codePoints);
        } catch(e) {
          return '🏁';
        }
      }
      return '🏁';
    }

    // Główna funkcja ładująca dane - tylko RAZ
    async function loadCalendarData() {
      if (loadingPromise) return loadingPromise;
      if (dataLoaded && cachedCalendar) return cachedCalendar;
      
      loadingPromise = (async () => {
        try {
          // Pokaż loading tylko w aktywnym panelu
          const activePanel = document.querySelector('.cal-panel.active');
          if (activePanel && activePanel.dataset.calPanel === 'wrc2026') {
            const upcomingGrid = document.getElementById('upcomingGrid');
            const pastGrid = document.getElementById('pastGrid');
            if (upcomingGrid) upcomingGrid.innerHTML = '<div class="loading-spinner"></div>';
            if (pastGrid) pastGrid.innerHTML = '<div class="loading-spinner"></div>';
          }
          
          await api.loadData();
          const rawData = api.data;
          let calendar = await api.getCalendar();
          
          if (!calendar || calendar.length === 0) {
            throw new Error('Brak danych');
          }
          
          // Zastosuj sortowanie
          calendar = getSortedCalendar(calendar, rawData);
          
          cachedCalendar = calendar;
          dataLoaded = true;
          return cachedCalendar;
        } catch (error) {
          console.error('Error loading calendar:', error);
          throw error;
        } finally {
          loadingPromise = null;
        }
      })();
      
      return loadingPromise;
    }
    
    // Renderowanie kalendarza (tylko gdy dane są już załadowane)
    async function renderCalendar() {
      const calendar = await loadCalendarData();
      
      if (!calendar || calendar.length === 0) {
        document.getElementById('upcomingGrid').innerHTML = '<div class="placeholder-cal">Brak rajdów w kalendarzu</div>';
        document.getElementById('pastGrid').innerHTML = '<div class="placeholder-cal">Brak zakończonych rajdów</div>';
        return;
      }
      
      // Pobierz wszystkie rajdy (anulowane też trafiają do odpowiednich kategorii)
      const past = calendar.filter(rally => rally.status === 'completed' || rally.status === 'cancelled');
      const upcoming = calendar.filter(rally => rally.status === 'upcoming' || rally.status === 'ongoing');
      
      renderRallyGrid('upcomingGrid', upcoming);
      renderRallyGrid('pastGrid', past);
    }
    
    // Odświeżenie tylko aktywnego widoku (po zmianie kolejności w adminie)
    async function refreshActiveView() {
      // Unieważnij cache
      dataLoaded = false;
      cachedCalendar = null;
      if (api) {
        if (typeof api._invalidateStorage === 'function') api._invalidateStorage();
        api.data = null;
        api._l1 = {};
        api._l1Time = 0;
        api._etag = null;
      }
      await renderCalendar();
    }
    
    // ============================================================
    // AUTO-ODŚWIEŻANIE - TYLKO PRZY RĘCZNYCH ZMIANACH Z ADMINA
    // ============================================================

    function setupAutoRefresh() {
      // TYLKO nasłuchiwanie na zmiany z admina
      try {
        const channel = new BroadcastChannel('wrc-data-invalidate');
        channel.onmessage = async (e) => {
          if (e.data?.action === 'invalidate') {
            console.log('[Calendar] Wykryto zmianę w adminie - odświeżenie');
            await refreshActiveView();
          }
        };
      } catch(e) { console.warn('BroadcastChannel not supported', e); }
    }

    // Funkcje sortowania
    function getCalendarGroupedByDate(calendar) {
      const groups = {};
      calendar.forEach(rally => {
        const dateKey = rally.startDate;
        if (!groups[dateKey]) groups[dateKey] = [];
        groups[dateKey].push(rally);
      });
      const sortedDates = Object.keys(groups).sort();
      return { groups, sortedDates };
    }
    
    function getStoredOrderForDate(rawData, dateKey) {
      const season = rawData?.seasons?.[rawData?.settings?.currentSeason];
      const order = season?.calendarOrder || {};
      return order[dateKey] || [];
    }
    
    function getSortedCalendar(calendar, rawData) {
      if (!calendar || calendar.length === 0) return [];
      if (!rawData) return [...calendar];
      
      const { groups, sortedDates } = getCalendarGroupedByDate(calendar);
      const result = [];
      
      for (const date of sortedDates) {
        const rallies = groups[date];
        const storedOrder = getStoredOrderForDate(rawData, date);
        
        if (storedOrder.length === rallies.length && storedOrder.every(id => rallies.some(r => r.id === id))) {
          const ordered = [];
          for (const id of storedOrder) {
            const rally = rallies.find(r => r.id === id);
            if (rally) ordered.push(rally);
          }
          for (const rally of rallies) {
            if (!ordered.includes(rally)) ordered.push(rally);
          }
          result.push(...ordered);
        } else {
          result.push(...rallies.sort((a, b) => a.name.localeCompare(b.name)));
        }
      }
      return result;
    }

    function formatDateRange(start, end) {
      const startDate = new Date(start);
      const endDate   = new Date(end);
      
      const monthNames = {
        'sty': 'Stycznia', 'lut': 'Lutego',    'mar': 'Marca',
        'kwi': 'Kwietnia','maj': 'Maja',      'cze': 'Czerwca',
        'lip': 'Lipca',  'sie': 'Sierpnia', 'wrz': 'Września',
        'paź': 'Października', 'lis': 'Listopada', 'gru': 'Grudnia'
      };
      
      function formatDate(date) {
        const day        = date.getDate();
        const monthShort = date.toLocaleDateString('pl-PL', { month: 'short' }).replace('.', '').toLowerCase();
        const month      = monthNames[monthShort] || monthShort;
        return `${day} ${month} ${date.getFullYear()}`;
      }
      
      function formatShortDate(date) {
        const day        = date.getDate();
        const monthShort = date.toLocaleDateString('pl-PL', { month: 'short' }).replace('.', '').toLowerCase();
        const month      = monthNames[monthShort] || monthShort;
        return `${day} ${month}`;
      }
      
      const sameDay = startDate.toDateString() === endDate.toDateString();
      if (sameDay) return formatDate(startDate);
      return `${formatShortDate(startDate)} – ${formatDate(endDate)}`;
    }

    function getStatusText(status) {
      switch(status) {
        case 'completed': return 'Minione wydarzenie';
        case 'ongoing': return 'Trwa';
        case 'cancelled': return 'Anulowany';
        default: return 'Nadchodzące wydarzenie';
      }
    }

    function getStatusIcon(status) {
      if (status === 'ongoing') {
        return `<svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="7" cy="7" r="5.5" stroke="currentColor" stroke-width="1.3"/><circle cx="7" cy="7" r="2.2" fill="currentColor"/></svg>`;
      } else if (status === 'completed') {
        return `<svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="7" cy="7" r="5.8" stroke="currentColor" stroke-width="1.25"/><line x1="7" y1="7" x2="7" y2="3.5" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/><line x1="7" y1="7" x2="9.8" y2="8.6" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/></svg>`;
      } else if (status === 'cancelled') {
        // Ikona X dla anulowanych rajdów
        return `<svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="7" cy="7" r="5.8" stroke="currentColor" stroke-width="1.25"/>
          <line x1="4.2" y1="4.2" x2="9.8" y2="9.8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="9.8" y1="4.2" x2="4.2" y2="9.8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>`;
      } else {
        return `<svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="7" cy="7" r="5.8" stroke="currentColor" stroke-width="1.25"/><line x1="7" y1="7" x2="7" y2="3.5" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/><line x1="7" y1="7" x2="9.8" y2="8.6" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/></svg>`;
      }
    }
    
    function renderRallyGrid(containerId, rallies) {
      const container = document.getElementById(containerId);
      
      if (!rallies || rallies.length === 0) {
        container.innerHTML = '<div class="placeholder-cal">- ⌛︎ -</div>';
        return;
      }
      
      let html = '';
      rallies.forEach(rally => {
        const statusText  = getStatusText(rally.status);
        const statusClass = rally.status === 'ongoing' ? 'status-ongoing' : 
                           (rally.status === 'completed' ? 'status-completed' : 
                           (rally.status === 'cancelled' ? 'status-cancelled' : 'status-upcoming'));
        const statusIcon  = getStatusIcon(rally.status);
        
        // Anulowane rajdy nie mają linku do wyników
        const hasResults  = (rally.status === 'completed' || rally.status === 'ongoing') && rally.status !== 'cancelled';
        const tag         = hasResults ? `a href="wyniki.html?rally=${rally.id}"` : 'div';
        const tagClose    = hasResults ? 'a' : 'div';
        
        const flagEmoji = getFlagEmoji(rally.country);
        
        html += `
          <${tag} class="rally-card ${statusClass}">
            <div class="rally-card__photo rally-card__photo--${rally.id}">
              <img class="rally-bg" src="${rally.heroImage || 'assets/default-rally.jpg'}" alt="${rally.name}" onerror="this.style.display='none'" />
              <div class="rally-card__photo-overlay"></div>
              <div class="rally-card__logo-wrap">
                <img class="rally-card__logo" src="${rally.logo || 'assets/default-logo.png'}" alt="${rally.name}" onerror="this.style.display='none'" />
              </div>
            </div>
            <div class="rally-card__info">
              <p class="rally-card__name">${escapeHtml(rally.name)}</p>
              <div class="rally-card__meta">
                <span class="rally-card__date">
                  <svg width="13" height="14" viewBox="0 0 13 14" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="0.75" y="1.65" width="11.5" height="10" rx="1.4" stroke="currentColor" stroke-width="1.3"/>
                    <path d="M0.75 5.75h11.5" stroke="currentColor" stroke-width="1.3"/>
                    <path d="M3.75 0.75v3M9.25 0.75v3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
                  </svg>
                  ${formatDateRange(rally.startDate, rally.endDate)}
                </span>
                <span class="rally-card__country">
                  <span class="flag-emoji">${flagEmoji}</span>
                  ${escapeHtml(rally.countryName)}
                </span>
                <div class="rally-card__status-divider"></div>
                <span class="rally-card__status ${statusClass}">
                  ${statusIcon}
                  ${statusText}
                </span>
              </div>
            </div>
          </${tagClose}>
        `;
      });
      
      container.innerHTML = html;
    }
    
    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]));
    }
    
    // Obsługa przełączania zakładek kalendarza
    const calTabs = document.querySelectorAll("[data-cal-tab]");
    const calPanels = document.querySelectorAll("[data-cal-panel]");
    
    calTabs.forEach(tab => {
      tab.addEventListener("click", () => {
        const target = tab.dataset.calTab;
        currentPanel = target;
        
        calTabs.forEach(t => t.classList.remove("active"));
        calPanels.forEach(p => p.classList.remove("active"));
        tab.classList.add("active");
        document.querySelector(`[data-cal-panel="${target}"]`).classList.add("active");
        
        // Jeśli to panel PRC #4 i dane nie są jeszcze załadowane - załaduj
        if (target === 'wrc2026' && !dataLoaded) {
          renderCalendar();
        }
      });
    });
    
    // Obsługa przełączania widoków (nadchodzące/zakończone)
    const subTabs = document.querySelectorAll(".view-sub-tab");
    const subPanels = document.querySelectorAll(".cal-sub-panel");
    
    subTabs.forEach(tab => {
      tab.addEventListener("click", () => {
        const target = tab.dataset.sub;
        subTabs.forEach(t => t.classList.remove("active"));
        subPanels.forEach(p => p.classList.remove("active"));
        tab.classList.add("active");
        document.querySelector(`[data-sub-panel="${target}"]`).classList.add("active");
      });
    });
    
    // Motyw
    (function(){
      document.body.classList.add('no-transition');
      if(localStorage.getItem('wrc-theme')==='dark') document.body.classList.add('dark');
      document.documentElement.classList.remove('wrc-dark');
      requestAnimationFrame(function(){
        requestAnimationFrame(function(){
          document.body.classList.remove('no-transition');
        });
      });
      
      var btn = document.getElementById('themeToggle');
      if(btn){
        btn.addEventListener('click', function(){
          document.body.classList.add('theme-animating');
          var isDark = document.body.classList.toggle('dark');
          localStorage.setItem('wrc-theme', isDark ? 'dark' : 'light');
          setTimeout(function(){ document.body.classList.remove('theme-animating'); }, 420);
          try{var c=new BroadcastChannel('wrc-theme');c.postMessage(isDark?'dark':'light');c.close();}catch(e){}
        });
      }
      
      try{
        var ch = new BroadcastChannel('wrc-theme');
        ch.onmessage = function(e){
          document.body.classList.add('theme-animating');
          if(e.data==='dark') document.body.classList.add('dark');
          else document.body.classList.remove('dark');
          setTimeout(function(){ document.body.classList.remove('theme-animating'); }, 420);
        };
      }catch(e){}
    })();
    
    // Inicjalizacja
    window._lastCalendarLoad = Date.now();
    renderCalendar();
    setupAutoRefresh();
    
    const logo = document.querySelector(".floating-logo");
    const hero = document.querySelector(".hero");
    function updateLogo() { logo.classList.toggle("logo--dark", hero.getBoundingClientRect().bottom <= 0); }
    window.addEventListener("scroll", updateLogo, { passive: true });
    updateLogo();
  </script>
</body>
</html>
